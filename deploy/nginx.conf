# ═══════════════════════════════════════════════════════════════
# AmsirarTrip — Initial Bootstrap Nginx Configuration (HTTP-only)
# Used exclusively during first-time deployment by deploy/setup.sh
# to obtain Let's Encrypt SSL certificates via ACME webroot.
# Replaced by nginx/amsirartrip.com.conf once SSL is active.
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name amsirartrip.com www.amsirartrip.com;

    # Certbot ACME webroot challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    # Temporary health check / status during initial setup
    location / {
        return 200 "AmsirarTrip VPS Bootstrap: Setting up SSL certificates...\n";
        add_header Content-Type text/plain;
    }
}
