<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Deep Navy Gradient for Capital 'A' -->
    <linearGradient id="navy-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d2b56" />
      <stop offset="60%" stop-color="#141f4b" />
      <stop offset="100%" stop-color="#0c1433" />
    </linearGradient>

    <!-- Warm Gold-Amber Gradient for Mane Swooshes & Outer Chest Curve -->
    <linearGradient id="mane-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0944a" />
      <stop offset="50%" stop-color="#c66b27" />
      <stop offset="100%" stop-color="#a84e18" />
    </linearGradient>

    <!-- Deep Crimson Gradient for Horse, Mane & Road Accents -->
    <linearGradient id="horse-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a1829" />
      <stop offset="55%" stop-color="#780d1f" />
      <stop offset="100%" stop-color="#5e0816" />
    </linearGradient>

    <style>
      .bg-circle { fill: #FAFAFA; }
      .ring-navy { fill: none; stroke: #12264b; stroke-width: 15; }
      .red { fill: url(#horse-crimson); }
      .orange { fill: url(#mane-gold); }
      .navy { fill: url(#navy-a); }
    </style>
  </defs>

  <!-- Outer #FAFAFA Background & Navy Blue Border Ring -->
  <circle class="bg-circle" cx="512" cy="512" r="498" />
  <circle class="ring-navy" cx="512" cy="512" r="466" />

  <!-- ==================== HORSE ILLUSTRATION (MATCHING REFERENCE & SIZED INSIDE BORDER) ==================== -->
  <g id="horse" transform="translate(2, -32) scale(1.02)">
    <!-- 1. Top Crimson Mane Wave -->
    <path
      class="red"
      d="M 162 312 C 242 368, 342 336, 445 278 C 536 226, 622 224, 701 272 C 624 238, 542 243, 453 294 C 346 354, 240 382, 162 312 Z"
    />

    <!-- 2. Middle Amber-Gold Mane Wave -->
    <path
      class="orange"
      d="M 122 333 C 200 410, 302 396, 404 330 C 456 298, 502 276, 548 270 C 502 282, 458 308, 410 342 C 304 412, 198 424, 122 333 Z"
    />

    <!-- 3. Bottom Amber-Gold Mane Wave -->
    <path
      class="orange"
      d="M 116 424 C 198 484, 300 470, 396 394 C 442 360, 480 326, 514 303 C 478 334, 438 372, 402 404 C 302 484, 196 496, 116 424 Z"
    />

    <!-- 4. Main Crimson Neck Arch -->
    <path
      class="red"
      d="M 405 446 C 452 362, 520 288, 602 266 C 638 256, 672 260, 701 272 C 670 268, 636 268, 604 278 C 524 302, 460 374, 414 456 Z"
    />

    <!-- 5. Horse Ear -->
    <path
      class="red"
      d="M 705 274 C 722 248, 742 235, 766 235 C 752 250, 742 266, 736 285 C 734 270, 738 256, 745 247 C 731 251, 718 262, 705 274 Z"
    />

    <!-- 6. Forehead, Nose Bridge & Snout -->
    <path
      class="red"
      d="M 750 292 C 772 306, 790 322, 798 334 C 799 341, 798 350, 804 358 C 828 384, 854 406, 876 424 C 884 432, 881 448, 862 460 C 872 446, 873 436, 865 429 C 841 408, 813 386, 790 359 C 786 352, 788 340, 784 332 C 775 319, 763 306, 750 292 Z"
    />

    <!-- 7. Cheek & Jawline -->
    <path
      class="red"
      d="M 627 369 C 652 420, 696 440, 748 436 C 762 436, 792 456, 824 476 C 836 483, 846 481, 855 475 C 848 486, 835 490, 819 482 C 788 465, 762 448, 744 448 C 688 450, 643 425, 627 369 Z"
    />

    <!-- 8. Throat & Horizontal Upper Chest Wave -->
    <path
      class="red"
      d="M 609 373 C 580 430, 598 518, 676 540 C 732 554, 784 528, 838 528 C 858 528, 876 533, 892 540 C 872 535, 852 534, 834 536 C 780 542, 728 568, 668 553 C 586 532, 568 434, 609 373 Z"
    />

    <!-- 9. Inner Crimson Lower Chest Wave (Clean Separation Gap Left of Throat & Amber Curve) -->
    <path
      class="red"
      d="M 571 446 C 556 496, 574 552, 604 606 C 628 650, 632 698, 610 736 C 622 696, 616 652, 592 608 C 562 554, 548 496, 571 446 Z"
    />

    <!-- 10. Outer Gold-Amber Lower Chest Wave (Clean Separation Gap Between Throat & Inner Crimson Wave) -->
    <path
      class="orange"
      d="M 588 502 C 602 546, 630 586, 648 632 C 664 678, 654 726, 620 760 C 644 722, 650 678, 636 634 C 618 588, 594 548, 588 502 Z"
    />
  </g>

  <!-- ==================== CAPITAL "A" WITH ROAD MOTIF (SAME SIZE AS PREVIEW) ==================== -->
  <g id="letter-A" transform="translate(138, -4) scale(2.14)">
    <!-- Crimson Right-Edge Accent & Bottom-Right Foot Bevel -->
    <path
      fill="url(#horse-crimson)"
      d="M 118 183 L 124 183 L 207 335 C 213 343, 219 347, 227 349 L 227 350 L 198 350 Z"
    />

    <!-- Main Navy Body of "A" with Curved Top-Left Serif & Softly Rounded Inner Triangle -->
    <path
      fill="url(#navy-a)"
      fill-rule="evenodd"
      d="M 52 183 C 74 182, 98 184, 122 183 L 204 335 C 209 343, 215 347, 223 349 L 150 349 C 158 347, 160 342, 156 333 L 135 287 C 133 284, 130 283, 126 283 L 81 283 C 77 283, 74 284, 72 288 L 55 326 C 50 338, 56 346, 69 350 L 23 350 C 33 345, 41 336, 48 322 L 95 218 C 101 204, 84 190, 52 184 Z
             M 84 268 C 81 268, 80 266, 81 263 L 101 222 C 103 218, 105 218, 107 222 L 126 263 C 127 266, 126 268, 123 268 Z"
    />

    <!-- #FAFAFA Road Strip inside Right Stem of "A" -->
    <path
      fill="#FAFAFA"
      d="M 102 184 L 114.5 184 L 196 349 L 183.5 349 Z"
    />

    <!-- Crimson Edge Accents along the Road -->
    <path
      stroke="#780d1f"
      stroke-width="2"
      fill="none"
      d="M 101 184 L 183 349 M 115.5 184 L 197 349"
    />

    <!-- 11 Crimson Rounded Ovals inside the Road -->
    <line
      x1="108.5"
      y1="188"
      x2="189.5"
      y2="345"
      stroke="#780d1f"
      stroke-width="4.8"
      stroke-dasharray="3.4 12.2"
      stroke-linecap="round"
    />
  </g>
</svg>
