# ═══════════════════════════════════════════════════════════════
# AmsirarTrip — Hardened Production Nginx Configuration
# Primary Domain: amsirartrip.com
# Security Profile: Strict SSL (TLS 1.2/1.3), HSTS Preload,
#                   OWASP Defense-in-Depth, Anti-Bot & Rate Limits
# ═══════════════════════════════════════════════════════════════

# Upstream connection pool to Astro Node.js process (persistent keepalive)
upstream astro_backend {
    server 127.0.0.1:4321 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# ─── 1. HTTP → HTTPS Canonical Redirection ────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name amsirartrip.com www.amsirartrip.com;

    # Let's Encrypt ACME verification challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    # Redirect all HTTP traffic permanently to canonical HTTPS domain
    location / {
        return 301 https://amsirartrip.com$request_uri;
    }
}

# ─── 2. HTTPS www → Non-www Canonical Redirection ─────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.amsirartrip.com;

    ssl_certificate /etc/letsencrypt/live/amsirartrip.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amsirartrip.com/privkey.pem;

    # HSTS on www subdomain to ensure secure redirection
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 301 https://amsirartrip.com$request_uri;
}

# ─── 3. Primary Production HTTPS Server ────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name amsirartrip.com;

    # ─── SSL / TLS Configuration (Mozilla Modern Standards) ────
    ssl_certificate /etc/letsencrypt/live/amsirartrip.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amsirartrip.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/amsirartrip.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # SSL Session Optimization & Forward Secrecy
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:20m;
    ssl_session_tickets off;

    # OCSP Stapling — DISABLED
    # Let's Encrypt certificates no longer include an OCSP responder URL
    # (deprecated in favor of short-lived certs + CRLs since mid-2025).
    # Enabling ssl_stapling with these certs causes a harmless but noisy warning.
    # ssl_stapling on;
    # ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ─── Core Security Headers (Defense in Depth) ──────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # ─── Information Disclosure & Server Hardening ─────────────
    server_tokens off;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Astro-Version;

    # ─── Slowloris, Buffer Overflow & DoS Hardening ────────────
    client_body_buffer_size 128k;
    client_max_body_size 10M;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;
    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 65s;
    send_timeout 10s;

    # ─── Traffic & Connection Rate Limits ──────────────────────
    limit_conn conn_limit 25;
    limit_req zone=general_limit burst=50 nodelay;

    # ─── Compression (Gzip) ────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # ─── Block Malicious Scanners & Probes ─────────────────────
    if ($bad_bot = 1) {
        return 403;
    }

    # Restrict allowed HTTP methods
    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$ ) {
        return 405;
    }

    # Block access to hidden files and version control
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Block PHP / CMS exploit probes immediately (Drop connection)
    location ~* (\.php|wp-admin|wp-login|xmlrpc\.php|eval-stdin|phpinfo|setup\.php|phpmyadmin|\.env|\.git|\.bak|\.sql|\.config) {
        deny all;
        access_log off;
        log_not_found off;
        return 444;
    }

    # ─── Static Assets: Astro Bundled Chunks (Immutable 1y) ────
    location /_astro/ {
        proxy_pass http://astro_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";

        # Re-apply security headers for static context (Nginx add_header inheritance)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # ─── Static Images, Icons & Fonts (30-day cache) ───────────
    location ~* ^/(images|icons|fonts)/ {
        proxy_pass http://astro_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ─── Standard Web Metadata Assets ──────────────────────────
    location = /favicon.ico {
        proxy_pass http://astro_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /robots.txt {
        proxy_pass http://astro_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1d;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* ^/sitemap.*\.xml$ {
        proxy_pass http://astro_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1h;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }

    # ─── API & Astro Action Endpoints (Strict Rate Limiting) ───
    location ~* ^/(_actions|api)/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://astro_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_hide_header X-Powered-By;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
    }

    # ─── Dynamic SSR & Page Routes (Astro Node Standalone) ─────
    location / {
        proxy_pass http://astro_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_hide_header X-Powered-By;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
    }
}
