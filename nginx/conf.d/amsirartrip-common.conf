# ═══════════════════════════════════════════════════════════════
# AmsirarTrip — Nginx Global HTTP-Level Configuration
# Place in /etc/nginx/conf.d/amsirartrip-common.conf
# (Automatically included in standard Ubuntu /etc/nginx/nginx.conf http {} block)
# ═══════════════════════════════════════════════════════════════

# Rate Limiting Zones (DDoS & Brute-Force Shield)
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=25r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Standard status code for rate limit rejection
limit_req_status 429;
limit_conn_status 429;

# Dynamic Connection upgrade mapping for WebSockets / SSE
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Malicious vulnerability scanners & automated exploit crawlers
map $http_user_agent $bad_bot {
    default 0;
    ~*(?i)(acunetix|sqlmap|nikto|masscan|wpscan|havij|nmap|zgrab|morfeus|nessus|openvas|dirbuster|gobuster|shodan) 1;
}
