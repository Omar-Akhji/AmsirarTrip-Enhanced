<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Crimson Gradient for Horse Head, Neck & Outer Mane -->
    <linearGradient id="horse-crimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a1829" />
      <stop offset="55%" stop-color="#781522" />
      <stop offset="100%" stop-color="#630f1b" />
    </linearGradient>

    <!-- Upper Amber-Gold Mane Gradient -->
    <linearGradient id="mane-gold-upper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d48444" />
      <stop offset="50%" stop-color="#b8652d" />
      <stop offset="100%" stop-color="#9c4f1f" />
    </linearGradient>

    <!-- Lower Amber-Orange Mane Gradient -->
    <linearGradient id="mane-gold-lower" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc7b44" />
      <stop offset="50%" stop-color="#c55a2f" />
      <stop offset="100%" stop-color="#a3431e" />
    </linearGradient>
  </defs>

  <!-- Centered & scaled to fit a 512x512 square canvas cleanly -->
  <g id="amsirar-horse-only" transform="translate(-219.9, 130.6) scale(0.8618)">
    <!-- Top Crimson Mane Wave -->
    <path d="M 324 91 C 385 126, 442 110, 502 82 C 562 54, 628 32, 691 58 C 632 40, 568 62, 508 90 C 446 118, 384 133, 324 91 Z" fill="url(#horse-crimson)" />

    <!-- Upper Amber-Gold Mane Wave -->
    <path d="M 282 103 C 348 156, 422 142, 488 104 C 534 78, 562 66, 589 63 C 556 73, 524 90, 484 114 C 416 153, 344 164, 282 103 Z" fill="url(#mane-gold-upper)" />

    <!-- Lower Amber-Orange Mane Wave -->
    <path d="M 277 154 C 334 198, 405 194, 468 148 C 510 116, 538 89, 565 79 C 536 98, 506 127, 464 158 C 402 203, 332 205, 277 154 Z" fill="url(#mane-gold-lower)" />

    <!-- Inner Crimson Mane & Neck Arch -->
    <path d="M 457 240 C 488 172, 532 108, 594 75 C 630 56, 666 53, 693 60 C 662 59, 626 64, 592 83 C 534 116, 494 176, 457 240 Z" fill="url(#horse-crimson)" />

    <!-- Horse Ear -->
    <path d="M 696 63 C 704 49, 718 41, 733 42 C 726 49, 720 57, 717 69 C 715 62, 717 53, 722 47 C 712 48, 703 55, 696 63 Z" fill="url(#horse-crimson)" />

    <!-- Horse Forehead, Bridge & Muzzle -->
    <path d="M 724 77 C 742 89, 753 102, 751 113 C 760 132, 779 152, 804 170 C 811 176, 809 188, 798 194 C 804 186, 803 178, 796 173 C 770 154, 750 134, 742 114 C 744 103, 736 90, 724 77 Z" fill="url(#horse-crimson)" />

    <!-- Horse Jawline & Cheek -->
    <path d="M 644 124 C 660 165, 694 184, 728 180 C 746 182, 768 196, 784 198 C 790 198, 795 196, 798 193 C 792 201, 782 204, 770 201 C 754 197, 740 188, 724 187 C 688 191, 654 168, 644 124 Z" fill="url(#horse-crimson)" />

    <!-- Horse Lower Neck & Chest Wave -->
    <path d="M 634 127 C 608 168, 624 226, 676 242 C 714 253, 754 238, 788 232 C 806 229, 820 232, 830 237 C 816 234, 800 234, 782 238 C 748 246, 710 261, 670 249 C 614 232, 599 170, 634 127 Z" fill="url(#horse-crimson)" />
  </g>
</svg>